[package]
name = "wisp-tui"
version = "0.21.1"
description = "Terminal front end for wisp chat: a scrolling conversation above a pinned input and status band"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# scrolling-regions: lines inserted above the band scroll a region instead of redrawing the band.
ratatui = { version = "0.30", features = ["scrolling-regions"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"

[lints]
workspace = true
