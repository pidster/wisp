[package]
name = "wisp-tui"
version = "0.29.1"
description = "Terminal front end for wisp chat: the conversation in a pane above a pinned input and status band"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"

[lints]
workspace = true
